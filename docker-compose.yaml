version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-educore}
      POSTGRES_USER: ${DB_USER:-educore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-educore_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-educore_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=api.educore.smarta.website,educore.smarta.website
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-educore}
      - DB_USER=${DB_USER:-educore_user}
      - DB_PASSWORD=${DB_PASSWORD:-educore_password}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://educore.smarta.website}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://educore.smarta.website}
    volumes:
      - media_data:/app/media
      - staticfiles_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8100:8100"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.educore-backend.rule=Host(`educore.smarta.website`) && (PathPrefix(`/api/`) || PathPrefix(`/admin/`) || PathPrefix(`/api-token-auth/`) || PathPrefix(`/swagger/`) || PathPrefix(`/redoc/`))"
      - "traefik.http.routers.educore-backend.entryPoints=https"
      - "traefik.http.routers.educore-backend.tls=true"
      - "traefik.http.routers.educore-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.educore-backend.priority=100"
      - "traefik.http.services.educore-backend.loadbalancer.server.port=8100"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
   # Remove ports - Traefik handles routing
    # ports:
    #   - "8080:80"
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.educore-frontend.rule=Host(`educore.smarta.website`)"
      - "traefik.http.routers.educore-frontend.entryPoints=https"
      - "traefik.http.routers.educore-frontend.tls=true"
      - "traefik.http.routers.educore-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.educore-frontend.priority=1"
      - "traefik.http.services.educore-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.educore-frontend-http.rule=Host(`educore.smarta.website`)"
      - "traefik.http.routers.educore-frontend-http.entryPoints=http"
      - "traefik.http.routers.educore-frontend-http.middlewares=redirect-to-https"

volumes:
  postgres_data:
  media_data:
  staticfiles_data: