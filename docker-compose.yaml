version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-educore}
      POSTGRES_USER: ${DB_USER:-educore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-educore_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-educore_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-educore}
      - DB_USER=${DB_USER:-educore_user}
      - DB_PASSWORD=${DB_PASSWORD:-educore_password}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    volumes:
      - media_data:/app/media
      - staticfiles_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8100:8100"  # Fixed indentation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/kurse/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify/Traefik handles port mapping automatically

volumes:
  postgres_data:
  media_data:
  staticfiles_data: